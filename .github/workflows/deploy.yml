name: Build y Deploy a Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite relanzar el despliegue a mano desde la pestaña Actions

# Nombres de SUS recursos en Azure (creados en la Pág. 04). Si cambian, se ajustan solo aquí.
env:
  RESOURCE_GROUP: rg-mlops-ean
  ACR_NAME: acrluisfermlops
  ENVIRONMENT: env-mi-proyecto
  APP_NAME: api-mlops-ean
  IMAGE_NAME: api-mlops-ean

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Paso 1 — Descargar el código del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Paso 2 — Autenticarse en Azure con el Service Principal
      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Paso 3 — Construir la imagen Docker
      - name: Login en Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build de la imagen
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .

      # Paso 4 — Subir la imagen al Container Registry
      - name: Push al Container Registry
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      # Paso 5 — Desplegar en Azure Container Apps (crea la app la primera vez, la actualiza después)
      - name: Deploy en Azure Container Apps
        uses: azure/cli@v2
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DATABRICKS_URL: ${{ secrets.DATABRICKS_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            az config set extension.use_dynamic_install=yes_without_prompt
            IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"

            if az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" > /dev/null 2>&1; then
              echo "La app existe: actualizando imagen y secretos"
              az containerapp secret set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --secrets databricks-url="$DATABRICKS_URL" databricks-token="$DATABRICKS_TOKEN"
              az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --image "$IMAGE" \
                --set-env-vars DATABRICKS_URL=secretref:databricks-url DATABRICKS_TOKEN=secretref:databricks-token
            else
              echo "Primera vez: creando la app"
              az containerapp create --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --environment "$ENVIRONMENT" \
                --image "$IMAGE" \
                --registry-server "$ACR_NAME.azurecr.io" \
                --registry-username "$ACR_USERNAME" --registry-password "$ACR_PASSWORD" \
                --target-port 8000 --ingress external \
                --min-replicas 0 --max-replicas 1 \
                --secrets databricks-url="$DATABRICKS_URL" databricks-token="$DATABRICKS_TOKEN" \
                --env-vars DATABRICKS_URL=secretref:databricks-url DATABRICKS_TOKEN=secretref:databricks-token
            fi

            URL=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                  --query properties.configuration.ingress.fqdn --output tsv)
            echo "API publicada en: https://$URL"
            echo "Documentación:    https://$URL/docs"
